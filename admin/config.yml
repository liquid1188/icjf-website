# Site editor (Sveltia CMS) for the International Catholic Jurists Forum.
# Each collection below is a preset: fill in the boxes, click Save, and the site
# rebuilds itself in a minute or two.
backend:
  name: github
  repo: liquid1188/icjf-website
  branch: main
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Remove {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://liquid1188.github.io/icjf-website/
display_url: https://liquid1188.github.io/icjf-website/
logo_url: ../img/icjf-seal.png
media_folder: img/uploads
public_folder: /img/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: news
    label: News
    label_singular: News item
    description: Articles and news for the News page. Link to the outside article, or write the item here.
    folder: content/news
    create: true
    slug: "{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - {name: title, label: Headline, widget: string}
      - {name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: author, label: Author, widget: string, required: false}
      - {name: source, label: Publication, widget: string, required: false, hint: "For example, The Catholic Thing"}
      - {name: link, label: Link to the article, widget: string, required: false, hint: "Full web address. Leave empty if the article is written below."}
      - name: tags
        label: Topics
        widget: select
        multiple: true
        required: false
        options: [News, Catholic News, Catholic Social Teaching, Bishops, Cardinals, China, Catholic Church in China, Africa, Catholic Church in Nigeria, Abortion, Contraception, Clergy sexual abuse, Religious freedom, Family, Conference, Synod, Pope Leo XIV]
      - {name: image, label: Picture, widget: image, required: false}
      - {name: body, label: Text, widget: markdown, required: false, hint: "Optional. A summary or the full article."}

  - name: press
    label: Press
    label_singular: Press item
    description: Media that is not tied to a book, conference, or project. Say in the title why it is here, for example who from ICJF was interviewed.
    folder: content/press
    create: true
    slug: "{{slug}}"
    summary: "{{date}} · {{title}}"
    fields:
      - {name: title, label: Title, widget: text, hint: "Name the ICJF person and their role, for example: ICJF Advisor Dr. Jane Doe Interviewed by EWTN on …"}
      - {name: link, label: Link, widget: string, hint: "Full web address of the article, video, or page"}
      - {name: image, label: Picture, widget: image, hint: "A landscape picture works best"}
      - {name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Newest items show first"}

  - name: conferences
    label: Conferences
    label_singular: Conference
    description: Conferences the Forum organized, co-hosted, or co-sponsored. They appear on the Conferences timeline by year.
    folder: content/conferences
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{year}} · {{title}}"
    fields:
      - {name: title, label: Conference title, widget: string}
      - {name: dates, label: Dates, widget: string, hint: "As it should read, for example: October 1-3, 2026"}
      - {name: year, label: Year, widget: string, pattern: ["^\\d{4}$", "Four-digit year"]}
      - {name: details, label: Hosts and place, widget: text, required: false, hint: "For example: co-hosted by ICJF with …, held at …, Rome, Italy."}
      - {name: body, label: More information, widget: markdown, required: false, hint: "Speakers, ICJF participants, or a short description"}
      - name: program
        label: Program (PDF)
        widget: file
        required: false
        media_folder: /files/uploads
        public_folder: /files/uploads
      - {name: link, label: Conference website, widget: string, required: false}
      - {name: coverage, label: Coverage link, widget: string, required: false, hint: "An article or video about the conference"}

  - name: books
    label: Books
    label_singular: Book
    description: Books for the Books page. Add a description to give the book its own page on the site.
    folder: content/books
    create: true
    slug: "{{slug}}"
    fields:
      - {name: title, label: Title, widget: string}
      - {name: authors, label: Authors or editors, widget: string, required: false}
      - {name: cover, label: Cover, widget: image}
      - {name: link, label: Where to buy, widget: string, required: false, hint: "Publisher or bookstore web address"}
      - {name: body, label: Description, widget: markdown, required: false, hint: "Optional. If filled in, the book gets its own page."}

  - name: people
    label: People
    label_singular: Person
    description: Executive team members and advisors, each with a card on Who We Are and a bio page.
    folder: content/people
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{group}} · {{name}}"
    fields:
      - {name: name, label: Name, widget: string, hint: "Plain name for the bio page, for example: Jane Doe"}
      - {name: card_name, label: Name with titles, widget: string, required: false, hint: "As shown on the card, for example: Dr. Jane Doe, Esq."}
      - {name: group, label: Section, widget: select, options: [Advisors, Executive Team], default: Advisors}
      - {name: role, label: Role, widget: string, required: false, hint: "Executive team only, for example: Director"}
      - {name: photo, label: Photo, widget: image, hint: "A portrait. Faces are cropped from the top."}
      - {name: order, label: Order on the executive team, widget: number, required: false, value_type: int}
      - {name: body, label: Bio, widget: markdown}

  - name: pages
    label: Pages
    label_singular: Page
    description: A new stand-alone page, for example a resource or a statement. Its address is made from the title.
    folder: content/pages
    create: true
    slug: "{{slug}}"
    fields:
      - {name: title, label: Title, widget: string}
      - {name: body, label: Text, widget: markdown}
