name: Build site
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "data/**"
      - "assets/**"
      - "_shell.html"
      - "site.json"
      - "build.py"
      - "cms_merge.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - run: python build.py
      - name: Commit generated pages
        run: |
          git config user.name "ICJF site builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Rebuild pages [skip ci]"
          git pull --rebase origin main
          git push
